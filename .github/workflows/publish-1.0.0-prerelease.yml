name: Publish approved LanLink 1.0.0 prerelease

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-1.0.0-prerelease.yml]

permissions:
  contents: write
  actions: read

concurrency:
  group: lanlink-approved-1.0.0-prerelease
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Koreapanda4444/LanLink'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: LanLink-1.0.0-release
          run-id: 42137323832
          github-token: ${{ github.token }}
          path: release-assets
      - name: Verify and publish the approved candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 release/publish_prerelease.py release-assets --publish
