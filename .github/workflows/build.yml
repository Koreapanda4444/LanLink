name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triplet: x64-linux
          - os: windows-latest
            triplet: x64-windows
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_DISABLE_METRICS: 1
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-binaries,readwrite
    steps:
      - uses: actions/checkout@v5
      - name: Validate Windows installer script syntax
        if: runner.os == 'Windows'
        run: |
          Get-ChildItem packaging/windows, tests -Recurse -File -Include *.ps1, *.psm1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref] $tokens, [ref] $errors) | Out-Null
            if ($errors.Count -ne 0) { throw ($errors | Out-String) }
          }
      - name: Checkout vcpkg baseline
        uses: actions/checkout@v5
        with:
          repository: microsoft/vcpkg
          ref: a1cae005c39be7b18ba319fced856b68d7276271
          path: .vcpkg
          fetch-depth: 1
      - name: Identify runner toolchain
        id: toolchain
        shell: pwsh
        run: '"image=$env:ImageVersion" >> $env:GITHUB_OUTPUT'
      - name: Cache vcpkg binaries
        uses: actions/cache/restore@v4
        id: vcpkg-cache
        with:
          path: ${{ github.workspace }}/.vcpkg-binaries
          key: ${{ runner.os }}-${{ matrix.triplet }}-vcpkg-${{ hashFiles('vcpkg.json') }}-${{ steps.toolchain.outputs.image }}
          restore-keys: ${{ runner.os }}-${{ matrix.triplet }}-vcpkg-
      - name: Prepare binary cache
        shell: pwsh
        run: New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE/.vcpkg-binaries" -Force | Out-Null
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build pkg-config linux-libc-dev
      - name: Bootstrap vcpkg (Linux)
        if: runner.os == 'Linux'
        run: '"$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics'
      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        run: '& "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics'
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          Invoke-WebRequest https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile "$env:RUNNER_TEMP/wintun.zip"
          if ((Get-FileHash "$env:RUNNER_TEMP/wintun.zip" -Algorithm SHA256).Hash -ne '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51') { throw 'Wintun archive hash mismatch' }
          Expand-Archive "$env:RUNNER_TEMP/wintun.zip" "$env:RUNNER_TEMP/wintun"
          $license = Get-ChildItem "$env:RUNNER_TEMP/wintun" -Recurse -File | Where-Object Name -Match '^(LICENSE|COPYING)(\.txt)?$' | Select-Object -First 1
          if (-not $license) { throw 'Wintun license is missing' }
          cmake -S . -B build -A x64 "-DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}" "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DLANLINK_PACKAGE_WINDOWS_CLIENT=ON "-DLANLINK_WINTUN_DLL=$env:RUNNER_TEMP/wintun/wintun/bin/amd64/wintun.dll" "-DLANLINK_WINTUN_LICENSE_FILE=$($license.FullName)"
      - name: Save vcpkg binaries
        if: always() && !cancelled() && steps.vcpkg-cache.outputs.cache-primary-key != '' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-binaries
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure
      - name: Package Windows client
        if: runner.os == 'Windows'
        run: cpack --config build/CPackConfig.cmake -C Release -B artifacts
      - name: Test Windows installation
        if: runner.os == 'Windows'
        run: |
          $archive = Get-ChildItem artifacts/*.zip | Select-Object -First 1
          Expand-Archive $archive.FullName "$env:RUNNER_TEMP/client-package"
          $installer = Get-ChildItem "$env:RUNNER_TEMP/client-package" -Filter Install-LanLink.ps1 -Recurse | Select-Object -First 1
          & ./tests/windows_package_tests.ps1 -PackageDirectory $installer.DirectoryName
      - name: Reproduce and verify locked-file installation recovery
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.2.0 --repo "$env:GITHUB_REPOSITORY" --pattern LanLink-0.2.0-windows-x64.zip --dir "$env:RUNNER_TEMP/rollback-baseline"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download the released rollback regression fixture.' }
          Expand-Archive "$env:RUNNER_TEMP/rollback-baseline/LanLink-0.2.0-windows-x64.zip" "$env:RUNNER_TEMP/rollback-baseline-expanded"
          $baseline = Get-ChildItem "$env:RUNNER_TEMP/rollback-baseline-expanded" -Filter Install-LanLink.ps1 -Recurse | Select-Object -First 1
          & ./tests/windows_rollback_lock_tests.ps1 -PackageDirectory $baseline.DirectoryName -ExpectIncompleteRollback
          $installer = Get-ChildItem "$env:RUNNER_TEMP/client-package" -Filter Install-LanLink.ps1 -Recurse | Select-Object -First 1
          & ./tests/windows_rollback_lock_tests.ps1 -PackageDirectory $installer.DirectoryName
      - name: Build Windows EXE installer
        if: runner.os == 'Windows'
        run: |
          $iscc = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $iscc)) { throw 'The runner must provide Inno Setup 6.' }
          $installer = Get-ChildItem "$env:RUNNER_TEMP/client-package" -Filter Install-LanLink.ps1 -Recurse | Select-Object -First 1
          & $iscc "/DPackageDir=$($installer.DirectoryName)" /DAppVersion=0.2.2 "/DSourceCommit=$env:GITHUB_SHA" "/O$env:GITHUB_WORKSPACE/artifacts" packaging/windows/LanLink.iss
          if ($LASTEXITCODE -ne 0) { throw 'EXE installer compilation failed.' }
      - name: Test Windows EXE installer
        if: runner.os == 'Windows'
        run: |
          $setup = Get-ChildItem artifacts/*Setup*.exe | Select-Object -First 1
          & ./tests/windows_setup_tests.ps1 -Installer $setup.FullName
      - name: Test Windows service and Wintun networking
        if: runner.os == 'Windows'
        run: |
          $installer = Get-ChildItem "$env:RUNNER_TEMP/client-package" -Filter Install-LanLink.ps1 -Recurse | Select-Object -First 1
          & ./tests/windows_network_tests.ps1 -PackageDirectory $installer.DirectoryName -RelayExecutable "$env:GITHUB_WORKSPACE/build/Release/lanlink-relay.exe" -DriverExecutable "$env:GITHUB_WORKSPACE/build/Release/lanlink_windows_network_tests.exe"
      - name: Preserve desktop screenshots
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: LanLink-desktop-screenshots
          path: ${{ runner.temp }}/lanlink-desktop-*.png
          if-no-files-found: error
      - name: Upload Windows client
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: LanLink-windows-x64
          path: |
            artifacts/*.zip
            artifacts/*.exe
          if-no-files-found: error
      - name: Preserve Windows network diagnostics
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: LanLink-windows-network-diagnostics
          path: ${{ runner.temp }}/lanlink-windows-network-*/**/*.log
          if-no-files-found: ignore
  relay-linux:
    name: Linux x64 relay (glibc 2.34)
    runs-on: ubuntu-latest
    container: oraclelinux:9
    timeout-minutes: 45
    env:
      VCPKG_DISABLE_METRICS: 1
    steps:
      - name: Install Linux relay build tools
        run: |
          dnf install --assumeyes --allowerasing git gcc gcc-c++ make perl-core pkgconf-pkg-config kernel-headers python3 python3-pip tar unzip zip curl systemd openssl ca-certificates findutils which diffutils binutils
          python3 -m pip install cmake==3.31.6 ninja==1.11.1.4
      - uses: actions/checkout@v5
      - name: Checkout vcpkg baseline
        uses: actions/checkout@v5
        with:
          repository: microsoft/vcpkg
          ref: a1cae005c39be7b18ba319fced856b68d7276271
          path: .vcpkg
          fetch-depth: 1
      - name: Identify Linux relay toolchain
        id: toolchain
        run: |
          echo "fingerprint=$(sha256sum /usr/bin/g++ | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Prepare Linux relay binary cache
        run: |
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/.vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_BINARY_SOURCES=clear;files,$GITHUB_WORKSPACE/.vcpkg-binaries,readwrite" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/.vcpkg-binaries"
      - name: Cache Linux relay vcpkg binaries
        uses: actions/cache/restore@v4
        id: vcpkg-cache
        with:
          path: .vcpkg-binaries
          key: linux-glibc234-x64-vcpkg-v2-${{ hashFiles('vcpkg.json') }}-${{ steps.toolchain.outputs.fingerprint }}
          restore-keys: linux-glibc234-x64-vcpkg-v2-
      - name: Build and package relay
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.vcpkg-binaries"
          bash deploy/linux/build-relay.sh
      - name: Save vcpkg binaries
        if: always() && !cancelled() && steps.vcpkg-cache.outputs.cache-primary-key != '' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-binaries
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - name: Test relay installation
        run: python3 tests/relay_package_tests.py build/relay/artifacts/*.tar.gz
      - name: Upload Linux relay
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: LanLink-relay-linux-x64
          path: build/relay/artifacts/*.tar.gz
          if-no-files-found: error
  relay-compatibility:
    name: Relay on ${{ matrix.distribution }}
    needs: relay-linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: Ubuntu 22.04
            container: ubuntu:22.04
          - distribution: Debian 12
            container: debian:12
    container: ${{ matrix.container }}
    steps:
      - name: Install server runtime and test tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates python3 openssl libstdc++6 systemd tar coreutils diffutils
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: LanLink-relay-linux-x64
          path: relay-package
      - name: Test the same Linux relay package
        run: python3 tests/relay_package_tests.py relay-package/*.tar.gz
  verify-release:
    name: Verify 0.2.2 release packages
    needs: [build, relay-linux, relay-compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: LanLink-windows-x64
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: LanLink-relay-linux-x64
          path: release-assets
      - name: Validate packages and generate release checksums
        run: python3 release/prepare.py release-assets --commit "$GITHUB_SHA"
      - name: Preserve verified release bundle
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: LanLink-0.2.2-release
          path: release-assets/*
          if-no-files-found: error
  release:
    name: Publish LanLink 0.2.2
    needs: verify-release
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'release: package LanLink 0.2.2')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: lanlink-release-0.2.2
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: LanLink-0.2.2-release
          path: release-assets
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 release/publish.py release-assets "$GITHUB_SHA"
