name: build
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
permissions:
  contents: read
  actions: read
jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          triplet: x64-linux
        - os: windows-latest
          triplet: x64-windows
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_DISABLE_METRICS: 1
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-binaries,readwrite
    steps:
    - uses: actions/checkout@v5
    - name: Validate Windows installer script syntax
      if: runner.os == 'Windows'
      run: |
        Get-ChildItem packaging/windows -Recurse -File -Include *.ps1, *.psm1 | ForEach-Object {
          $tokens = $null
          $errors = $null
          [Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref] $tokens, [ref] $errors) | Out-Null
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }
        }
    - name: Checkout vcpkg baseline
      uses: actions/checkout@v5
      with:
        repository: microsoft/vcpkg
        ref: a1cae005c39be7b18ba319fced856b68d7276271
        path: .vcpkg
        fetch-depth: 1
    - name: Identify runner toolchain
      id: toolchain
      shell: pwsh
      run: '"image=$env:ImageVersion" >> $env:GITHUB_OUTPUT'
    - name: Cache vcpkg binaries
      uses: actions/cache/restore@v4
      id: vcpkg-cache
      with:
        path: ${{ github.workspace }}/.vcpkg-binaries
        key: ${{ runner.os }}-${{ matrix.triplet }}-vcpkg-v2-${{ hashFiles('vcpkg.json', 'cmake/ports/**') }}-${{ steps.toolchain.outputs.image }}
        restore-keys: ${{ runner.os }}-${{ matrix.triplet }}-vcpkg-
    - name: Prepare binary cache
      shell: pwsh
      run: New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE/.vcpkg-binaries" -Force | Out-Null
    - name: Install Linux build tools
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install --yes ninja-build pkg-config autoconf autoconf-archive automake libtool libltdl-dev linux-libc-dev libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libdbus-1-dev libibus-1.0-dev xvfb fonts-noto-cjk iproute2 iptables
    - name: Bootstrap vcpkg (Linux)
      if: runner.os == 'Linux'
      run: '"$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics'
    - name: Bootstrap vcpkg (Windows)
      if: runner.os == 'Windows'
      run: '& "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics'
    - name: Configure (Linux)
      if: runner.os == 'Linux'
      run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLANLINK_BUILD_DESKTOP=ON -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
    - name: Configure (Windows)
      if: runner.os == 'Windows'
      run: |
        Invoke-WebRequest https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile "$env:RUNNER_TEMP/wintun.zip"
        if ((Get-FileHash "$env:RUNNER_TEMP/wintun.zip" -Algorithm SHA256).Hash -ne '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51') { throw 'Wintun archive hash mismatch' }
        Expand-Archive "$env:RUNNER_TEMP/wintun.zip" "$env:RUNNER_TEMP/wintun"
        $license = Get-ChildItem "$env:RUNNER_TEMP/wintun" -Recurse -File | Where-Object Name -Match '^(LICENSE|COPYING)(\.txt)?$' | Select-Object -First 1
        if (-not $license) { throw 'Wintun license is missing' }
        cmake -S . -B build -A x64 "-DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}" "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DLANLINK_PACKAGE_WINDOWS_CLIENT=ON "-DLANLINK_WINTUN_DLL=$env:RUNNER_TEMP/wintun/wintun/bin/amd64/wintun.dll" "-DLANLINK_WINTUN_LICENSE_FILE=$($license.FullName)"
    - name: Save vcpkg binaries
      if: success() && steps.vcpkg-cache.outputs.cache-primary-key != '' && steps.vcpkg-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}/.vcpkg-binaries
        key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
    - name: Build
      run: cmake --build build --config Release --parallel 2
    - name: Package Linux desktop client
      if: runner.os == 'Linux'
      run: cmake --build build --target lanlink_client_archive
    - name: Package Windows client
      if: runner.os == 'Windows'
      run: cpack --config build/CPackConfig.cmake -C Release -B artifacts
    - name: Extract Windows installer payload
      if: runner.os == 'Windows'
      run: |-
        $archive = Get-ChildItem artifacts/*.zip | Select-Object -First 1
        Expand-Archive $archive.FullName "$env:RUNNER_TEMP/client-package"
    - name: Build Windows EXE installer
      if: runner.os == 'Windows'
      run: |
        $iscc = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
        if (-not (Test-Path $iscc)) { throw 'The runner must provide Inno Setup 6.' }
        $installer = Get-ChildItem "$env:RUNNER_TEMP/client-package" -Filter Install-LanLink.ps1 -Recurse | Select-Object -First 1
        & $iscc "/DPackageDir=$($installer.DirectoryName)" /DAppVersion=1.0.0 "/DSourceCommit=$env:GITHUB_SHA" "/O$env:GITHUB_WORKSPACE/artifacts" packaging/windows/LanLink.iss
        if ($LASTEXITCODE -ne 0) { throw 'EXE installer compilation failed.' }
    - name: Upload Windows client
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        overwrite: true
        name: LanLink-windows-x64
        path: |-
          artifacts/*.zip
          artifacts/*.exe
        if-no-files-found: error
    - name: Upload Linux client
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: LanLink-linux-x64
        path: build/artifacts/LanLink-*-linux-*.tar.gz
        if-no-files-found: error
  macos-client:
    name: macOS native client
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_DISABLE_METRICS: 1
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-binaries,readwrite
    steps:
    - uses: actions/checkout@v5
    - uses: actions/checkout@v5
      with:
        repository: microsoft/vcpkg
        ref: a1cae005c39be7b18ba319fced856b68d7276271
        path: .vcpkg
        fetch-depth: 1
    - name: Prepare native macOS tools
      run: |
        brew install openssl@3 ninja
        echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
        mkdir -p "$GITHUB_WORKSPACE/.vcpkg-binaries"
    - uses: actions/cache/restore@v4
      id: native-cache
      with:
        path: .vcpkg-binaries
        key: macos-client-${{ runner.arch }}-deployment14-${{ hashFiles('vcpkg.json', 'cmake/triplets/*.cmake', 'cmake/ports/**') }}-${{ runner.os }}
        restore-keys: macos-client-${{ runner.arch }}-
    - name: Bootstrap native dependencies
      run: '"$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics'
    - name: Configure native macOS client
      run: cmake -S . -B build/macos-client -G Ninja -DCMAKE_BUILD_TYPE=Release -DLANLINK_BUILD_DESKTOP=ON -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
    - name: Save native dependency cache
      if: success() && steps.native-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: .vcpkg-binaries
        key: ${{ steps.native-cache.outputs.cache-primary-key }}
    - name: Build native macOS client
      run: cmake --build build/macos-client --parallel 2
    - name: Package macOS client
      run: |-
        plutil -lint deploy/macos/com.lanlink.client.plist
        cmake --build build/macos-client --target lanlink_client_archive
    - name: Upload macOS client
      uses: actions/upload-artifact@v4
      with:
        name: LanLink-macos
        path: build/macos-client/artifacts/LanLink-*-macos-*.zip
        if-no-files-found: error
  relay-linux:
    name: Linux x64 relay (glibc 2.34)
    runs-on: ubuntu-latest
    container: oraclelinux:9
    timeout-minutes: 45
    env:
      VCPKG_DISABLE_METRICS: 1
    steps:
    - name: Install Linux relay build tools
      run: |
        dnf install --assumeyes --allowerasing git gcc gcc-c++ make perl-core pkgconf-pkg-config kernel-headers python3 python3-pip tar unzip zip curl systemd openssl ca-certificates findutils which diffutils binutils
        python3 -m pip install cmake==3.31.6 ninja==1.11.1.4
    - uses: actions/checkout@v5
    - name: Checkout vcpkg baseline
      uses: actions/checkout@v5
      with:
        repository: microsoft/vcpkg
        ref: a1cae005c39be7b18ba319fced856b68d7276271
        path: .vcpkg
        fetch-depth: 1
    - name: Identify Linux relay toolchain
      id: toolchain
      run: |
        echo "fingerprint=$(sha256sum /usr/bin/g++ | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
    - name: Prepare Linux relay binary cache
      run: |
        echo "VCPKG_ROOT=$GITHUB_WORKSPACE/.vcpkg" >> "$GITHUB_ENV"
        echo "VCPKG_BINARY_SOURCES=clear;files,$GITHUB_WORKSPACE/.vcpkg-binaries,readwrite" >> "$GITHUB_ENV"
        mkdir -p "$GITHUB_WORKSPACE/.vcpkg-binaries"
    - name: Cache Linux relay vcpkg binaries
      uses: actions/cache/restore@v4
      id: vcpkg-cache
      with:
        path: .vcpkg-binaries
        key: linux-glibc234-x64-vcpkg-v2-${{ hashFiles('vcpkg.json', 'cmake/ports/**') }}-${{ steps.toolchain.outputs.fingerprint }}
        restore-keys: linux-glibc234-x64-vcpkg-v2-
    - name: Build and package relay
      run: |
        mkdir -p "$GITHUB_WORKSPACE/.vcpkg-binaries"
        bash deploy/linux/build-relay.sh
    - name: Save vcpkg binaries
      if: success() && steps.vcpkg-cache.outputs.cache-primary-key != '' && steps.vcpkg-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: .vcpkg-binaries
        key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
    - name: Upload Linux relay
      uses: actions/upload-artifact@v4
      with:
        overwrite: true
        name: LanLink-relay-linux-x64
        path: build/relay/artifacts/*.tar.gz
        if-no-files-found: error
  relay-compatibility:
    name: Relay on ${{ matrix.distribution }}
    needs: relay-linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
        - distribution: Ubuntu 22.04
          container: ubuntu:22.04
        - distribution: Debian 12
          container: debian:12
    container: ${{ matrix.container }}
    steps:
    - name: Install server runtime tools
      run: |
        apt-get update
        apt-get install --yes --no-install-recommends ca-certificates python3 openssl libstdc++6 systemd tar coreutils diffutils
    - uses: actions/checkout@v5
    - uses: actions/download-artifact@v4
      with:
        name: LanLink-relay-linux-x64
        path: relay-package
    - name: Check packaged relay runtime
      run: |-
        mkdir -p relay-runtime
        tar -xzf relay-package/*.tar.gz -C relay-runtime
        find relay-runtime -type f -name lanlink-relay -exec {} --version \;
  verify-release:
    name: Verify 1.0.0 release packages
    needs:
    - build
    - relay-linux
    - relay-compatibility
    - macos-client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5
    - uses: actions/download-artifact@v4
      with:
        name: LanLink-windows-x64
        path: release-assets
    - uses: actions/download-artifact@v4
      with:
        name: LanLink-relay-linux-x64
        path: release-assets
    - uses: actions/download-artifact@v4
      with:
        name: LanLink-linux-x64
        path: native-release/linux
    - uses: actions/download-artifact@v4
      with:
        name: LanLink-macos
        path: native-release/macos
    - name: Collect native release archives
      run: |
        python3 -c 'from pathlib import Path; import shutil; [shutil.copyfile(p,Path("release-assets")/p.name) for p in Path("native-release").rglob("*") if p.is_file() and p.name.endswith((".zip",".tar.gz"))]'
    - name: Validate packages and generate release checksums
      run: python3 release/prepare.py release-assets --commit "$GITHUB_SHA" --native
    - name: Preserve verified release bundle
      uses: actions/upload-artifact@v4
      with:
        overwrite: true
        name: LanLink-1.0.0-release
        path: release-assets/*
        if-no-files-found: error
  release:
    name: Publish LanLink 1.0.0
    needs: verify-release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: lanlink-release-1.0.0
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
    - uses: actions/checkout@v5
    - uses: actions/download-artifact@v4
      with:
        name: LanLink-1.0.0-release
        path: release-assets
    - name: Publish verified release
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 release/publish.py release-assets "$GITHUB_SHA"
'on':
  push: null
  pull_request: null
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified release after explicit approval
        type: boolean
        default: false
